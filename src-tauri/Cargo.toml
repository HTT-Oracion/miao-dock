[package]
name = "miao-dock"
version = "2.2.1"
description = "喵坞 MiaoDock · Box 桌面端（漫画翻译 + 音乐应用）"
edition = "2021"
rust-version = "1.77"
# F0 拆出第二个 `[[bin]] mangasvc`（e2e 的 rust 靶子）之后，`cargo run` 变歧义：
# cargo 不会猜「哪个是应用」，直接报 "could not determine which binary to run"。
# 开发态最常敲的就是裸 `cargo run`（Tauri 也走它），让它默认跑桌面端；
# 要跑服务靶子仍须显式 `--bin mangasvc`（e2e 与 `check:autostart` 一直显式给）。
default-run = "miao-dock"

# F0 起：新增 lib.rs。桌面端仍是单目标，但**服务侧**（mangasvc）与**跨端共用**的纯逻辑
# （paths）要在 lib 里，好让独立的 `[[bin]] mangasvc`（e2e 的 rust 靶子）复用同一份实现
# —— 见 src/lib.rs 文件头。Tauri 装配（进程 / 窗口 / 托盘 / IPC）仍全在 src/main.rs。
[lib]
name = "miao_dock"
path = "src/lib.rs"

[[bin]]
name = "miao-dock"
path = "src/main.rs"

# 独立可运行的服务靶子（e2e 的 rust 侧）。读同一份 MIAO_* 环境变量、同样打印就绪行，
# 与 Node 版 manga-service 行为等价 —— 这样 e2e 只换靶子、不换断言。
[[bin]]
name = "mangasvc"
path = "src/bin/mangasvc.rs"

# 动漫域的服务进程（D-242）。与 mangasvc **同构但相互隔离**：
# 自己一份 state/令牌/库根/运行时根，端口在 5180–5190 内探测 ⇒ 两个 exe 可同时运行。
# 不并进 mangasvc 的子命令：动漫将来要自带引擎栈与数据源，依赖集与漫画翻译互不相干。
[[bin]]
name = "animesvc"
path = "src/bin/animesvc.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ver1.0 只需要 http://127.0.0.1，曾关掉默认 features 省掉 TLS 编译成本。
# ver2.0 音乐模块（D-22 移植参考实现）要访问公网 HTTPS（music.163.com /
# gateway.kugou.com / c.y.qq.com / app.c.nf.migu.cn …），缺 TLS 是**静默失败**：
# 依赖装得上、cargo build 全绿，运行时才报错 —— 现有断言只覆盖 127.0.0.1，
# 一个都测不到。详见 docs/internal/spec-notes.md D-25。
# 用 rustls-tls 而非 native-tls：纯 Rust 实现，无 OpenSSL 系统依赖。
# stream：音频代理（audio_proxy）流式透传需要 bytes_stream()。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }

# ── 音乐模块（移植自参考实现，§5.2）依赖 ──
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs", "io-util", "signal"] }
axum = "0.7"                       # 音频代理（Range/206）
futures-util = "0.3"               # 流式透传
url = "2"
dirs = "5"                         # 个人信息磁盘缓存目录
log = "0.4"
lofty = "0.21"                     # 本地音频元数据/封面
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
aes = "0.8"                        # 网易云 eapi/weapi 加密
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
md-5 = "0.10"                       # RustCrypto MD5（lib 名 md5，提供 Md5+Digest）
num-bigint = "0.4"
hex = "0.4"
rand = "0.8"
regex = "1"                        # QQ 音乐歌词 HTML 清洗
quick-xml = "0.37"                 # 番剧数据源 RSS / Atom 读取（M3；1 个 crate，MIT，只读流式解析，不引序列化）
sha1 = "0.10"                      # QQ 音乐签名
sha2 = "0.10"                      # store 落盘的 item.sha256（Node crypto.createHash('sha256')）
unicode-normalization = "0.1"      # 漫画名规范化（复刻 JS String.normalize('NFKC')）
chrono = "0.4"                     # QQ 音乐 searchid 时间戳
urlencoding = "2"                  # QQ/酷狗 搜索参数编码
encoding_rs = "0.8"                # QQ 音乐 GB18030 解码
uuid = { version = "1", features = ["v4"] }  # 咪咕 cookie id

# ── S2 三进程生命周期：进程**组**信号（`kill(-pgid, …)`）──
# 为什么需要：回收时必须连孙进程一起带走（真引擎会自拉一个执行器子进程，
# SIGKILL 主进程后它会被 reparent 到 launchd 并继续占住 port+1）。std 的
# `Child::kill()` 只打直接子进程，没有"对进程组发信号"的接口 ⇒ 用 libc。
# 仅 unix 需要；Windows 分支走 `taskkill /T /F`，不依赖它。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A3c：父死看守器在 Windows 上要装控制台 Ctrl+C handler（否则看守器被直接终止、
# 被看守的 llama-server 留在原地占着 8080）。版本与锁文件里已有的传递依赖对齐。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
