<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喵坞 · MiaoDock</title>
    <!-- 字体 -->
    <link rel="stylesheet" href="/assets/fonts/yozai-font/font.css" />
    <link rel="stylesheet" href="/assets/fonts/swei-gothic/font.css" media="print" onload="this.media = 'all'" />
    <link rel="stylesheet" href="/assets/fonts/lxgw-wenkai-gb/font.css" media="print" onload="this.media = 'all'" />
  </head>
  <body>
    <div id="root">
      <!-- splash 脚本 -->
      <script>
        (function () {
          var m = null;
          try {
            m = localStorage.getItem('miao.theme');
          } catch (e) {
            /* 读不到就用系统偏好 */
          }
          if (m !== 'light' && m !== 'dark') {
            try {
              m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } catch (e) {
              m = 'light';
            }
          }
          document.documentElement.dataset.boot = m;
        })();
      </script>
      <style>
        html,
        body {
          background: #f6f8f9;
        }
        html[data-boot='dark'],
        html[data-boot='dark'] body {
          background: #111820;
        }
        #boot-splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 30px;
          background: inherit;
          font:
            400 12px/1.6 'Segoe UI',
            'PingFang SC',
            'Microsoft YaHei',
            system-ui,
            sans-serif;
          color: #2d3b46;
          -webkit-font-smoothing: antialiased;
        }
        html[data-boot='dark'] #boot-splash {
          color: #edf3f7;
        }
        #boot-splash .m {
          position: relative;
          width: 64px;
          height: 64px;
        }
        #boot-splash .m i {
          position: absolute;
          inset: 0;
          border: 2px solid transparent;
          border-top-color: #6e97b9;
          border-radius: 50%;
          animation: boot 1.6s linear infinite;
        }
        #boot-splash .m i:nth-child(2) {
          inset: 9px;
          border-top-color: #dfa47d;
          animation: 2.1s linear infinite boot reverse;
        }
        #boot-splash .m i:nth-child(3) {
          inset: 18px;
          border-top-color: #8ca88c;
          animation-duration: 2.7s;
        }
        @keyframes boot {
          to {
            transform: rotate(360deg);
          }
        }
        #boot-splash p {
          margin: 0;
          text-align: center;
        }
        #boot-splash b {
          display: block;
          font-size: 15px;
          font-weight: 600;
          letter-spacing: 0.16em;
          text-indent: 0.16em;
          text-transform: uppercase;
        }
        #boot-splash span {
          color: #7e8d98;
        }
        html[data-boot='dark'] #boot-splash span {
          color: #8798a5;
        }
        @media (prefers-reduced-motion: reduce) {
          #boot-splash .m i {
            animation: none;
          }
        }
      </style>
      <!-- splah dom -->
      <div id="boot-splash" role="status" aria-live="polite">
        <div class="m" aria-hidden="true"><i></i><i></i><i></i></div>
        <p><b>喵坞</b><span>正在启动…</span></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
