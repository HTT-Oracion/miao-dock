[package]
name = "miaodock-installer"
version = "2.2.1"
description = "喵坞安装器 · 自带界面的 WebView 安装向导，内嵌载荷自解包安装"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 与主应用同一条技术栈：同一个 Tauri 大版本，窗口只用一个（安装向导本身）
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 载荷解包：只读内嵌的 zip。纯 Rust，无 C++ 工具链、无系统依赖（代价：编译产物 +约 0.3 MB）
zip = { version = "2", default-features = false, features = ["deflate"] }
# 写 .lnk：几十 KB 量级，纯 Rust 拼 Shell Link 结构，避免引 COM / OLE（代价：仅运行时）
mslnk = "0.1"

# 系统信息与安装动作：磁盘可用空间、长路径开关（**只读**）、卸载注册表项（HKLM / HKCU）、
# 已知文件夹（桌面真实路径）、自检提权（ShellExecuteW + runas）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
strip = true
