#   cd src && PYTHONPATH=src SAKURA_API_BASE=http://127.0.0.1:8080/v1 SAKURA_VERSION=0.9 \
#     venv/bin/python -m manga_translator local \
#       -i <repo>/test-manga -o <eng>/out-first \
#       --config-file <eng>/sakura-chs.config.json \
#       --font-path src/fonts/msyh.ttc --overwrite
#
# --config-file 内容（🔴 `local` **没有** `--translator` CLI 参数，只能这样传）：
#   {"translator":{"translator":"sakura","target_lang":"CHS"},
#    "detector":{"detector":"default"},"inpainter":{"inpainter":"lama_large"},"ocr":{"ocr":"48px"}}
#
# 实测结果：
#   产物        = runtimes/manga-translator/out-first/test_0.webp（1125×1600，322 KB）
#   耗时        = **1.6 分钟**（CPU；含模型加载）
#   流水线       = 检测(DefaultDetector 1536×2048) → OCR(Model48pxOCR，**21 个文本框**) →
#                翻译(Sakura 0.9 → 简体中文) → 掩码细化 → 擦除(LamaLarge 1128×1600) → 上字 → 落盘
#   像素取证     = 与原图逐像素比对：**4.94% 像素有实质差异**（最大通道差 255）⇒ 确实改图了，不是原图回写
#   译文抽样     = いらっしゃい→"真让人不爽。" · これ全部をきみひとりが…？→"这些全部都是你一个人…？"
#
# ⚠️ 两个**已观察到、S1 必须处理**的行为（不是本轮的失败，但要记）：
#   ① **行数不匹配 → 重试路径会打出 `Error code: 404 {'error':{'message':'File Not Found'}}`**。
#      11 行原文 → 10 行译文，触发 `_check_translation_quality` 重译；重译那一次 404，然后**降级为逐行翻译**
#      （`_translate_single_lines`）才成功。⇒ 404 的成因未定位；**逐行降级是它能出结果的原因**，
#      接真引擎时这条路径会被频繁走到，S1 要单独盯（可能拉长耗时）。
#   ② **1.5B 档的译文质量明显一般**（`いらっしゃい` 译成"真让人不爽"是错的；`野バト`(野鸽) 被译成"野兔"）。
#      ⇒ 这是**产品选型问题**，不是管线问题：Tiny 档只能验"通"，若要"可用"得上 8B/14B 档（下载量与耗时都要重估）。

## 6. Windows 10 移植（✅ 2026-10-07 全链路真机跑通）

# 平台 = Windows 10 · i5-12400 · RTX 4060 Ti 8GB · 15.7GB RAM
# Python = 3.11.17（python-build-standalone win-x64，非 §3 的 aarch64-apple-darwin）

### 6.1 实装落点（与 §3 的 macOS 布局逐项对照）
# 解释器    = runtimes/manga-translator/python-3.11/python.exe
# venv      = runtimes/manga-translator/venv/        ← **Windows 布局**：venv/Scripts/python.exe
# site-pkgs = venv/Lib/site-packages                 ← macOS 是 venv/lib/python3.11/site-packages
# torch     = 2.14.1+cu126 · torchvision 0.29.1+cu126（CUDA 12.6；cuda.is_available()=True，device=RTX 4060 Ti）
#             ↑ 与 §3 的 2.14.1 **同版本号**，只是换成 cu126 构建 ⇒ 后端差异只在构建，不在版本
# numpy     = 1.26.4（上游钉死。torchvision 会先拉 2.4.6，装 requirements 时被降回 1.26.4）
# 其余      = transformers 5.19.0 · onnxruntime 1.30.0 · accelerate 1.15.0 · pydantic 2.5.0
#             fastapi 0.125.0（回溯落点，与 §3 一致）· rusty-manga-image-translator 0.12.1 · manga-ocr 0.1.16
# llama     = bin/llama/llama-b11417/llama-server.exe（win-cuda-12.4 + cudart；条目见 models.manifest.json）
# 新增脚本  = engine/scripts/setup-engine.mjs（下 Python 运行时 + 引擎源码）
#             engine/scripts/install-engine-deps.mjs（装 venv 依赖，Windows 适配版，见 §6.3）

### 6.2 🔴 Windows 侧必踩的三个坑（本轮实测，非推测）
# ① **`vcvars64.bat` 在本环境不可用**：它靠 `reg.exe` 查注册表定位 Windows SDK，而本机 sandbox **拦截 reg.exe**
#    ⇒ 直接 call 它会拿到一份**缺 ucrt/um 头目录的残缺 INCLUDE**（编译时找不到 `io.h` 之类）。
#    处置：install-engine-deps.mjs **不用 vcvars**，改为**手动拼 INCLUDE/LIB/PATH**
#    （MSVC include + SDK ucrt/shared/um/winrt/cppwinrt），并设 `DISTUTILS_USE_SDK=1` + `MSSdk=1`
#    让 setuptools/distutils **跳过 vcvarsall**、直接吃现成环境。
# ② **`rc.exe` 不在 MSVC 目录，在 Windows SDK 的 `bin/<ver>/x64`**。漏进 PATH 会在**链接**阶段炸：
#    `LINK : fatal error LNK1158: 无法运行"rc.exe"` —— 报错发生在 link、离"PATH 少了个 SDK bin"很远。
# ③ `npm run app` 另外还因缺 `src-tauri/icons/icon.ico` 编译失败（tauri-build 的 Windows 资源文件）；
#    已补（从 icon.png 转 PNG-compressed ICO）并把 `icon.ico` 加进 tauri.conf.json 的 `bundle.icon`。
# 本机 MSVC/SDK 路径 = C:\VS2022BT\VC\Tools\MSVC\14.44.35207
#                    + C:\Program Files (x86)\Windows Kits\10\{Include,Lib,bin}\10.0.22621.0

### 6.3 依赖安装：**必须拆两批**
# pydensecrf 在 PyPI **没有任何 Windows wheel**，只能源码编译。而 pip 是"先全部收集、最后统一安装"的**事务**：
# 只要 pydensecrf 编译失败，整批 100+ 依赖会**一起回滚** ⇒ 全白装。故拆两批：
#   批 A：requirements.txt **剔掉 pydensecrf 行** → 纯 wheel，一把装完
#   批 B：`pip install --no-build-isolation <pydensecrf zip>` → 走 MSVC 编译
# 网络：github 直连本机常被代理拦（502）；pydensecrf 改为**先经镜像下 zip 到本地**再装
#   （`ghfast.top` / `gh-proxy.com` 前缀实测可通 —— 与 §3 记的 `ghfast.top` 同源）。

### 6.4 🔴 pydensecrf 的 master 是**移动靶** —— 上游已改版 API
# 上游把旧的**模块级常量**迁进了枚举，而引擎源码用的是旧写法：
#   旧（引擎 `mask_refinement/text_mask_utils.py:84-90`）：`dcrf.DIAG_KERNEL` / `dcrf.NO_NORMALIZATION`
#   新（master 现在导出）：`dcrf.KernelType.DIAG_KERNEL` / `dcrf.NormalizationType.NO_NORMALIZATION`
# 取证：`master.zip` 体积从 §3 那轮的 **2.2 MB** 变成现在的 **2.3 MB** ⇒ 内容确实变了（不是"我们装错了"）。
# 症状（真机实测）：`AttributeError: module 'pydensecrf.densecrf' has no attribute 'DIAG_KERNEL'`，
#   出现在**掩码细化**一步 —— 检测/OCR/Sakura 翻译**都已跑完**才炸，很容易误判成"翻译坏了"。
# ✅ 处置：install-engine-deps.mjs 加**幂等兼容补丁**（写进 venv 的 `pydensecrf/__init__.py`），
#   把枚举成员回填成模块级同名常量 ⇒ 新旧 API 都能用。
# ⚠️ 未做、建议后续：`requirements.txt` 那行直链 master 应**钉到具体 commit/tag**，否则每次重装都可能再变。

