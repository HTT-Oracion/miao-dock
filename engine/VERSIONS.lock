## 8. 引擎的真实形状（S0 读源码实测，S1 适配层按这个写）

# 入口与端口（**终结 README 里 8000/8001/5003 的四种说法**：它们不是漂移，是**不同入口**）
web_entry    = `python -m server.main --port 8000`   # FastAPI + uvicorn，默认 host 127.0.0.1 / port **8000**
executor     = 上面那条命令**自己会拉起子进程**：`python -m manga_translator shared --host <h> --port <8000+1> --nonce <n>`
             # `server/main.py:244 start_translator_client_proc()`，`__main__` 里 `args.start_instance = True` 是**强制的**
             # ⇒ **端口成对出现：8000(web) + 8001(executor)**
             # 🔴 **必须用 `python -m server.main` 起**：CLI 的 `--start-instance` 本身**默认 False**，
             #    只有 `__main__`（main.py:394）会把它覆写成 True。若改用 `uvicorn server.main:app` 或
             #    直接 import app，**执行器不会起来** —— 那条分支（main.py:289-292）只清空并重建
             #    `upload-cache/`，然后等**外部执行器**来 `POST /register`。
             #    ⇒ 症状会是"web 活着但翻译请求永远在等执行器"，且**不报错**。
shared_entry = `python -m manga_translator shared --port 5003`   # 单跑执行器时的默认端口（README 的"5003"出处）
ws_entry     = `python -m manga_translator ws --port 5003`       # WebSocket 模式
local_entry  = `python -m manga_translator local -i <img>`       # **CLI 单图/批处理**，落 `result/final.png`
             # ⇒ **S0 要的"跑一张真翻译"用这条最省事**（不起 web、不起执行器、没有 nonce）
             # 参数（`manga_translator/args.py:117-130`，子命令名就是 `local` 而非 batch）：
             #   `-i/--input`（必需，nargs='+'，**目录或文件**）· `-o/--dest` · `-f/--format`（choices=OUTPUT_FORMATS）
             #   `--overwrite` · `--save-text` / `--load-text`（互斥）· `--skip-no-text` · `--config-file`
             #   通用组：`--use-gpu` / `--use-gpu-limited`（**互斥**）· `--model-dir` · `--kernel-size` · `--ignore-errors`
             # 🔴 **翻译器不在 CLI**：`--translator` / `target_lang` 属于 `TranslatorConfig`（config.py:219-222），
             #    CLI **没有** `--translator`（server/args.py 也没有）⇒ 只能经 `--config-file <json>` 传。
             #    默认值：`translator = sugoi`（离线日→英）· `target_lang = 'ENG'`。
             #    `translators/__init__.py:66` 有 **`Translator.none`**（不翻译档，只走检测/擦除/上字）
             #    ⇒ 可用它**先把"引擎能跑完流水线"与"翻译质量"分开验**（本项目"管路通≠功能通"的引擎侧对应物）。

# 进程树深度（🔴 比计划假设的深：计划按"服务 → 引擎"两层写）
#   manga-service → server.main(uvicorn, 8000) → manga_translator shared(执行器, 8001) → [llama-server]
#   ⚠️ `proc.terminate()` 只覆盖**一层**（`main.py:272 handle_exit_signals`），
#     执行器再往下拉的东西（模型/LMM）不在它的信号范围内 ⇒ **孤儿回收风险比计划里写的高**，S2 重估。
#   ⚠️ 它**不打印"就绪行"**（只先打 `Nonce: <hex>`，然后 uvicorn 的日志）
#     ⇒ 计划里的"三重判定（进程存活 + 端口 + HTTP 应答）"是必需的，不是过度设计。

# 鉴权：web 与执行器之间用 `--nonce`（`X-Nonce` 头）。默认自动生成 16 字节 hex；
#       `MT_WEB_NONCE` 可覆盖。⇒ 本项目要自己掌握这个 nonce，不能让它随进程随机。
# 关键端点（`server/main.py`）：
#   POST /translate/image             ← **本项目适配层要用的那个**（返回结果图）
#   POST /translate/image/stream      ← 1 字节状态 + 4 字节长度 的流式（status 0/1/2/3/4）
#   POST /translate/with-form/image   ← multipart 变体（文件名/字段名按这个抄）
#   POST /translate/json · /translate/bytes · /queue-size
#   GET  /docs                        ← S1 的 OpenAPI 快照来源
#   POST /register（internal-api，要 X-Nonce）· GET /results/list · DELETE /results/{folder}
# 其余启动参数（`server/args.py`）：`--use-gpu` / `--use-gpu-limited` / `--models-ttl`（默认 **0 = 永不卸载**）
#   / `--verbose` / `--pre-dict` / `--post-dict` / `--ignore-errors`

