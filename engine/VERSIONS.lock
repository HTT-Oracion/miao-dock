## 1. 运行时（本机已实测 ✅）

source       = python-build-standalone（astral-sh）
source_url   = https://mirror.nju.edu.cn/github-release/astral-sh/python-build-standalone/20261003/cpython-3.12.15%2B20261003-aarch64-apple-darwin-install_only.tar.gz
source_tag   = 20261003
python       = 3.12.15
platform     = macOS 15.1.1 / arm64
install_to   = runtimes/manga-translator/python/
venv         = runtimes/manga-translator/venv/
# 为什么不用 Homebrew：本机沙箱内 `brew install` 在下载校验阶段失败
# （sandbox-exec: sandbox_apply: Operation not permitted，非网络问题，见计划 R11）。
# 且项目内运行时同时满足「独立于 app/」与后续打包需求。

## 2. 已验证的依赖（本机实测 ✅，仅探针范围）

torch        = 2.14.1          # cp312 / macosx_14_0_arm64
numpy        = 2.5.3
# 实测（tmp-engine-test/mps-probe.py）：
#   mps.is_built() = True · mps.is_available() = True
#   张量 matmul 结果与 CPU **逐位一致**（最大偏差 0.000e+00）
#   conv2d 1024×1024×32ch：MPS ≈ 10.1 ms / CPU ≈ 342 ms（≈ 34×）
#   mps 已分配 386 MB · driver 已分配 1032 MB
# ⚠️ 这只是「torch+MPS 可用」的证明，**不是** manga-image-translator 装得起来的证明。

