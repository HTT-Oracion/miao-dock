name: CI

# 为什么现在才加：本项目有 70+ 个 check/selftest，但**全部靠人自觉执行** ——
# 28k 行自证体系唯一的缺口就是"没有强制执行点"（审计 §2.1）。
# 这里把**秒级、零依赖、跨平台**的那批设为必过门；真机门（cargo release 打包 /
# 真权重 E3·E7 / E11 real）不进常规门，避免 CI 变成"永远红"的摆设。
#
# ⚠️ 2026-10-30 临时收缩：只留 lint + prettier。Rust 构建靶子 / 系统依赖 /
#    selftest / 判定层 / tsc+build 全部注释保留（在下方，恢复时整块解开即可）。
#    背景：ubuntu 缺 tauri 系统依赖、macOS 冷缓存全量编译太久，报错淹没真实回归。

on:
  push:
    branches: ['main', 'v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 检查（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 守 Linux 回归；macos 是本项目的主目标平台（D-140：防止再写死 darwin）
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装前端依赖
        run: npm ci

      # ── 代码校验：eslint + prettier（本地由 husky 的 pre-commit 守着，这里是强制点）──
      - name: 代码校验（eslint + prettier）
        run: |
          npm run lint
          npm run format:check

      # ────────────────────────────────────────────────────────────────────
      # 以下暂时停用（2026-10-30）。恢复顺序：先解开"Rust 工具链"三步，
