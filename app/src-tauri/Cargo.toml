[package]
name = "miao-dock"
version = "0.1.0"
description = "喵坞 MiaoDock · Box 桌面端（漫画翻译）"
edition = "2021"
rust-version = "1.77"

# 桌面端单目标：逻辑全在 src/main.rs（无移动端目标，不需要 lib.rs 那套 [lib] 配置）
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ver1.0 只需要 http://127.0.0.1，曾关掉默认 features 省掉 TLS 编译成本。
# ver2.0 音乐模块（D-22 移植参考实现）要访问公网 HTTPS（music.163.com /
# gateway.kugou.com / c.y.qq.com / app.c.nf.migu.cn …），缺 TLS 是**静默失败**：
# 依赖装得上、cargo build 全绿，运行时才报错 —— 现有断言只覆盖 127.0.0.1，
# 一个都测不到。详见 docs/spec-notes.md D-25。
# 用 rustls-tlis 而非 native-tls：纯 Rust 实现，无 OpenSSL 系统依赖。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
