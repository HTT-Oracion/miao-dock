<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      桌面歌词窗口的独立入口（Rust 侧 `WebviewUrl::App("lyrics.html")`，label 固定
      `desktop-lyrics`，见 `src-tauri/src/lyrics_window.rs`）。

      为什么必须有这个文件、而不能在主页面里判 URL 切换：
      桌面歌词的定义是「浮在所有应用之上、跟随播放」，这要求它是**真正的独立窗口** ——
      同一个 WebView 里切视图做不到切走应用后继续显示（会被盖住 / 失去焦点）。
      vite.config.ts 的 rollupOptions.input 已登记本入口，两个入口落在同一 dist 目录，
      因此与主窗同 origin（dev http://localhost:1420 / prod tauri://localhost），
      localStorage 才能共享（实测结论见台账 D-47）。

      ⚠️ 本入口刻意**不引 base.css / app.css**：那两份是主窗的外壳样式（浅色底、
      整页布局、侧边导航），歌词窗是深色玻璃浮条，语义完全不同。窗口自己的样式
      全部内联在 DesktopLyrics.tsx 里，只在这个窗口存在。
    -->
    <title>桌面歌词</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/screens/lyrics/index.ts"></script>
  </body>
</html>
